id: io.github.ychsue.nonblockinglife
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: io.github.ychsue.nonblockinglife
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  # - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # - --talk-name=org.kde.StatusNotifierWatcher
  # - --talk-name=org.freedesktop.Notifications
  # - --env=DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
  # 確保加上以下與語言/環境變數相關的權限：
  # - --filesystem=host:ro  # 讓應用程式能讀取系統設定 (若需要)
  # - --system-talk-name=org.freedesktop.resolve1
  # - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: NonBlockingLife
    buildsystem: simple
    build-options:
      # 💡 這一行最重要！它會把 dotnet10 的指令路徑加進環境變數
      append-path: /usr/lib/sdk/dotnet10/bin
      # 本機測試用：允許 build 期間連網 restore NuGet。上 Flathub 前需改為離線來源
      # (flatpak-dotnet-generator.py 產生 nuget-sources.json) 並移除此行。
      # build-args:
      #   - --share=network
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
    build-commands:
      # # 1. 檢查目前目錄底下有哪些檔案（確認 nuget-sources.json 有沒有進來）
      # - ls -la
      # # 2. 檢查 flatpak-builder 有沒有把套件解開到預期的資料夾
      # - find / -name "*.nupkg" 2>/dev/null || true      
      # 先進行離線還原，指定從本機目錄讀取套件
      - dotnet restore src/Nbl.Desktop/Nbl.Desktop.csproj --packages /run/build/NonBlockingLife/nuget-packages -s /run/build/NonBlockingLife/nuget-sources -r linux-x64
      - ls src/Nbl.Desktop/obj/project.assets.json
      - grep -n "linux-x64" src/Nbl.Desktop/obj/project.assets.json || echo "找不到 linux-x64 目標！"
      - dotnet restore src/Nbl.Bridge/Nbl.Bridge.csproj --packages /run/build/NonBlockingLife/nuget-packages -s /run/build/NonBlockingLife/nuget-sources -r linux-x64
      - ls src/Nbl.Bridge/obj/project.assets.json
      - grep -n "linux-x64" src/Nbl.Bridge/obj/project.assets.json || echo "找不到 linux-x64 目標！"
      # # 檢查 NuGet 套件來源是否存在
      # - ls -la nuget-sources || true

      # 接著進行發布 
      - dotnet publish src/Nbl.Desktop/Nbl.Desktop.csproj -c Release -r linux-x64 --self-contained true --no-restore -p:PublishAot=false -p:RuntimeIdentifiers=linux-x64 -p:RestorePackagesPath=/run/build/NonBlockingLife/nuget-packages -p:NblUseSystemBass=true -o /app/lib/nonblockinglife
      - mkdir -p /app/bin
      - ln -s /app/lib/nonblockinglife/Nbl.Desktop /app/bin/io.github.ychsue.nonblockinglife
      - install -Dm644 io.github.ychsue.nonblockinglife.desktop /app/share/applications/io.github.ychsue.nonblockinglife.desktop
      - install -Dm644 io.github.ychsue.nonblockinglife.png /app/share/icons/hicolor/256x256/apps/io.github.ychsue.nonblockinglife.png
    # 4. 🔥 關鍵：安裝 metainfo.xml 到 AppStream 標準目錄
      - install -Dm644 io.github.ychsue.nonblockinglife.metainfo.xml /app/share/metainfo/io.github.ychsue.nonblockinglife.metainfo.xml
    sources:
      - type: dir
        path: .
      - type: dir
        path: src
        dest: src
      - ./nuget-sources.json
