<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <!-- iOS PWA 必需 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NonBlockingLife" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>NonBlockingLife PWA</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      console.debug('[index.html] Initializing TWA bridge... location:', window.location.href);
      window.__NBL_TWA_BRIDGE__ = window.__NBL_TWA_BRIDGE__ || {
        port: null,
        connected: false,
        lastMessage: null,
        eventLog: [],
      };

      const updateBridgeState = (event, port) => {
        const state = window.__NBL_TWA_BRIDGE__;
        state.port = port;
        state.connected = Boolean(port);
        state.lastMessage = event?.data ?? null;
        state.eventLog = [...(state.eventLog || []), {
          data: event?.data ?? null,
          origin: event?.origin ?? null,
          ports: event?.ports ?? [],
          ts: Date.now(),
        }].slice(-20);

        if (port && port.onmessage === null) {
          port.onmessage = (portEvent) => {
            console.log('[index.html] Android replied via port:', portEvent.data);
            state.lastMessage = portEvent.data;
          };
        }
      };

      window.__NBL_TWA_BRIDGE__.ping = function pingTwaPort() {
        const port = window.__NBL_TWA_BRIDGE__.port;
        if (!port) {
          console.warn('[index.html] No TWA port yet; cannot ping Android.');
          return false;
        }

        const payload = {
          type: 'nbl:pwa-ping',
          from: 'pwa',
          ts: Date.now(),
        };

        port.postMessage(payload);
        console.log('[index.html] Sent TWA ping to Android:', payload);
        return true;
      };

      const forwardTwaMessage = (event) => {
        const port = Array.isArray(event.ports) && event.ports.length > 0 ? event.ports[0] : null;
        updateBridgeState(event, port);

        if (port) {
          console.log('[index.html] TWA bridge ready. Current state:', window.__NBL_TWA_BRIDGE__);
          //立刻回傳看看onPostMessage是否正常
          port.postMessage({
            type: 'pwa-get-port',
            from: 'pwa',
            ts: Date.now(),
          });
        }

        window.dispatchEvent(
          new CustomEvent('nbl:twa:message', {
            detail: {
              data: event.data,
              port,
              timestamp: Date.now(),
            },
          }),
        );
      };

      window.addEventListener('message', (event) => {
        console.debug('[index.html] TWA message event:', {
          url: window.location.href,
          data: event.data,
          origin: event.origin,
          source: event.source,
          portsLength: event.ports?.length ?? 0,
          ports: event.ports ?? [],
        });
        forwardTwaMessage(event);
      });

      console.log('[index.html] TWA bridge ready. Current state:', window.__NBL_TWA_BRIDGE__);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
