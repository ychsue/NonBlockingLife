<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <!-- iOS PWA 必需 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NonBlockingLife" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>NonBlockingLife PWA</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__NBL_TWA_BRIDGE__ = window.__NBL_TWA_BRIDGE__ || {
        port: null,
        connected: false,
        lastMessage: null,
      };

      const forwardTwaMessage = (event) => {
        const port = Array.isArray(event.ports) && event.ports.length > 0 ? event.ports[0] : null;
        window.__NBL_TWA_BRIDGE__.port = port;
        window.__NBL_TWA_BRIDGE__.connected = Boolean(port);
        window.__NBL_TWA_BRIDGE__.lastMessage = event.data;

        window.dispatchEvent(
          new CustomEvent('nbl:twa:message', {
            detail: {
              data: event.data,
              port,
              timestamp: Date.now(),
            },
          }),
        );
      };

      window.addEventListener('message', (event) => {
        console.debug('[index.html] TWA message received data:', event.data);
        console.debug('[index.html] TWA message origin:', event.origin);
        console.debug('[index.html] TWA message source:', event.source);
        console.debug('[index.html] TWA message ports:', event.ports);
        forwardTwaMessage(event);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
